<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Members</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <h1>Family Members</h1>
  <a href="../index.html" class="btn-home">Back to Home</a>

  <h2 id="formTitle">Add a Family Member</h2>
  <form id="familyForm">
    <input type="hidden" id="familyID">

    <label>First Name</label>
    <input type="text" id="firstName" required><br>

    <label>Last Name</label>
    <input type="text" id="lastName" required><br>

    <label>Date of Birth</label>
    <input type="date" id="dob" required><br>

    <label>SSN</label>
    <input type="text" id="ssn"><br>

    <label>Medicare Number</label>
    <input type="text" id="medicareNo"><br>

    <label>Phone</label>
    <input type="text" id="phone" required><br>

    <label>Email</label>
    <input type="email" id="email"><br>

    <label>Address</label>
    <input type="text" id="address"><br>

    <label>City</label>
    <input type="text" id="city"><br>

    <label>Province</label>
    <input type="text" id="province"><br>

    <label>Postal Code</label>
    <input type="text" id="postalCode" required><br>

    <label>Registered At</label>
    <select id="locationID" required></select><br>

    <button type="submit" id="submitBtn">Add Family Member</button>
    <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
  </form>
  <p id="formMessage"></p>

  <h2>All Family Members</h2>
  <table border="1" id="familyTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>City</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="familyBody"></tbody>
  </table>

  <h2>Link a Family Member as a Minor's Guardian</h2>
  <form id="linkForm">
    <label>Family Member</label>
    <select id="linkFamilyID" required></select><br>

    <label>Minor (Club Member)</label>
    <select id="linkMemberNo" required></select><br>

    <label>Relationship</label>
    <select id="linkRelationship" required>
      <option>Father</option>
      <option>Mother</option>
      <option>Grandfather</option>
      <option>Grandmother</option>
      <option>Tutor</option>
      <option>Partner</option>
      <option>Friend</option>
      <option>Other</option>
    </select><br>

    <label>Family Type</label>
    <select id="linkFamilyType" required>
      <option value="Primary">Primary</option>
      <option value="Secondary">Secondary</option>
    </select><br>

    <button type="submit" id="linkSubmitBtn">Link</button>
    <button type="button" id="unlinkToggleBtn">Unlink Instead</button>
  </form>
  <p id="linkMessage"></p>

  <script src="../js/api.js"></script>
  <script>
    const form = document.getElementById("familyForm");
    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const formTitle = document.getElementById("formTitle");
    const formMessage = document.getElementById("formMessage");
    const locationSelect = document.getElementById("locationID");

    let familyCache = [];

    async function loadLocationOptions() {
      const locations = await getLocations();
      locationSelect.innerHTML = locations
        .map(l => `<option value="${l.locationID}">${l.name}</option>`)
        .join("");
    }

    async function loadFamilyMembers() {
      familyCache = await getFamilyMembers();
      const body = document.getElementById("familyBody");
      body.innerHTML = "";

      familyCache.forEach(f => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${f.familyID}</td>
          <td>${f.firstName} ${f.lastName}</td>
          <td>${f.city || ""}</td>
          <td>${f.currentLocation || ""}</td>
          <td>
            <button onclick="editFamilyMember(${f.familyID})">Edit</button>
            <button onclick="removeFamilyMember(${f.familyID})">Delete</button>
          </td>
        `;
        body.appendChild(row);
      });

      const linkFamilySelect = document.getElementById("linkFamilyID");
      linkFamilySelect.innerHTML = familyCache
        .map(f => `<option value="${f.familyID}">${f.firstName} ${f.lastName} (#${f.familyID})</option>`)
        .join("");
    }

    async function loadMinorOptions() {
      const minors = await getMinors();
      const linkMemberSelect = document.getElementById("linkMemberNo");
      linkMemberSelect.innerHTML = minors
        .map(m => `<option value="${m.memberNo}">${m.firstName} ${m.lastName} (#${m.memberNo})</option>`)
        .join("");
    }

    function editFamilyMember(id) {
      const f = familyCache.find(x => x.familyID === id);
      if (!f) return;

      document.getElementById("familyID").value = f.familyID;
      document.getElementById("firstName").value = f.firstName;
      document.getElementById("lastName").value = f.lastName;
      document.getElementById("dob").value = f.dob;
      document.getElementById("ssn").value = f.ssn || "";
      document.getElementById("medicareNo").value = f.medicareNo || "";
      document.getElementById("phone").value = f.phone;
      document.getElementById("email").value = f.email || "";
      document.getElementById("address").value = f.address || "";
      document.getElementById("city").value = f.city || "";
      document.getElementById("province").value = f.province || "";
      document.getElementById("postalCode").value = f.postalCode;
      if (f.currentLocationID) locationSelect.value = f.currentLocationID;

      formTitle.textContent = "Edit Family Member";
      submitBtn.textContent = "Save Changes";
      cancelBtn.style.display = "inline";
    }

    function resetForm() {
      form.reset();
      document.getElementById("familyID").value = "";
      formTitle.textContent = "Add a Family Member";
      submitBtn.textContent = "Add Family Member";
      cancelBtn.style.display = "none";
      formMessage.textContent = "";
    }

    cancelBtn.addEventListener("click", resetForm);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("familyID").value;
      const data = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        dob: document.getElementById("dob").value,
        ssn: document.getElementById("ssn").value,
        medicareNo: document.getElementById("medicareNo").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        province: document.getElementById("province").value,
        postalCode: document.getElementById("postalCode").value,
        locationID: locationSelect.value,
      };

      try {
        if (id) {
          await updateFamilyMember(id, data);
        } else {
          await createFamilyMember(data);
        }
        resetForm();
        loadFamilyMembers();
      } catch (err) {
        formMessage.textContent = "Error: " + err.message;
      }
    });

    async function removeFamilyMember(id) {
      if (confirm("Delete this family member?")) {
        try {
          await deleteFamilyMember(id);
          loadFamilyMembers();
        } catch (err) {
          formMessage.textContent = "Error: " + err.message;
        }
      }
    }

    const linkForm = document.getElementById("linkForm");
    const linkMessage = document.getElementById("linkMessage");
    const linkSubmitBtn = document.getElementById("linkSubmitBtn");
    const unlinkToggleBtn = document.getElementById("unlinkToggleBtn");
    let unlinkMode = false;

    unlinkToggleBtn.addEventListener("click", () => {
      unlinkMode = !unlinkMode;
      linkSubmitBtn.textContent = unlinkMode ? "Unlink" : "Link";
      unlinkToggleBtn.textContent = unlinkMode ? "Link Instead" : "Unlink Instead";
    });

    linkForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const familyID = document.getElementById("linkFamilyID").value;
      const memberNo = document.getElementById("linkMemberNo").value;

      try {
        if (unlinkMode) {
          await unlinkFamilyMemberFromMinor(familyID, memberNo);
          linkMessage.textContent = "Unlinked.";
        } else {
          const relationship = document.getElementById("linkRelationship").value;
          const familyType = document.getElementById("linkFamilyType").value;
          await linkFamilyMemberToMinor(familyID, { memberNo, relationship, familyType });
          linkMessage.textContent = "Linked.";
        }
      } catch (err) {
        linkMessage.textContent = "Error: " + err.message;
      }
    });

    loadLocationOptions()
      .then(loadFamilyMembers)
      .then(loadMinorOptions);
  </script>

</body>
</html>

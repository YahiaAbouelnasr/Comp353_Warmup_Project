<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payments</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <h1>Payments</h1>
  <a href="../index.html" class="btn-home">Back to Home</a>

  <h2>Record a Payment</h2>
  <form id="paymentForm">
    <label>Club Member #</label>
    <input type="number" id="memberNo" required><br>

    <label>Payment Date</label>
    <input type="date" id="paymentDate" required><br>

    <label>Amount ($)</label>
    <input type="number" step="0.01" id="amount" required><br>

    <label>Method</label>
    <select id="method" required>
      <option>Cash</option>
      <option>Debit</option>
      <option>Credit</option>
    </select><br>

    <label>Membership Year</label>
    <input type="number" id="membershipYear" required><br>

    <button type="submit">Record Payment</button>
  </form>

  <h2>Payment History</h2>
  <label>Search by Club Member #</label>
  <input type="number" id="searchMemberNo">
  <button id="searchBtn">Search</button>

  <table border="1" id="paymentsTable">
    <thead>
      <tr>
        <th>Payment ID</th>
        <th>Date</th>
        <th>Amount</th>
        <th>Method</th>
      </tr>
    </thead>
    <tbody id="paymentsBody"></tbody>
  </table>

  <script src="../js/api.js"></script>
  <script>
    async function loadPayments(memberNo) {
      const payments = await getPayments(memberNo);
      const body = document.getElementById("paymentsBody");
      body.innerHTML = "";

      payments.forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.paymentID}</td>
          <td>${p.paymentDate}</td>
          <td>${p.amount}</td>
          <td>${p.method}</td>
        `;
        body.appendChild(row);
      });
    }

    document.getElementById("paymentForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        memberNo: document.getElementById("memberNo").value,
        paymentDate: document.getElementById("paymentDate").value,
        amount: document.getElementById("amount").value,
        method: document.getElementById("method").value,
        membershipYear: document.getElementById("membershipYear").value
      };

      await createPayment(data);
      e.target.reset();
      loadPayments();
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      const memberNo = document.getElementById("searchMemberNo").value;
      loadPayments(memberNo);
    });

    loadPayments();
  </script>

</body>
</html>
